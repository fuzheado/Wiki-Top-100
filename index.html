<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wikipedia Top 100 Connections</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
       background: #1a1a2e; color: #e0e0e0; overflow: hidden; height: 100vh; }

#controls {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(26,26,46,0.95); backdrop-filter: blur(10px);
  padding: 6px 16px;
  border-bottom: 1px solid #333;
}
.controls-row {
  display: flex; align-items: center; gap: 12px; height: 32px;
}
.controls-row + .controls-row {
  border-top: 1px solid #2a2a4a; padding-top: 4px; margin-top: 2px;
}
#controls h1 { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; }
#controls h1 span { color: #888; font-weight: 400; }
#controls .sep { width: 1px; height: 20px; background: #333; flex-shrink: 0; }
#controls label { font-size: 11px; color: #aaa; display: flex; align-items: center; gap: 4px; cursor: pointer; flex-shrink: 0; }
#controls input[type=text] {
  background: #2a2a4a; border: 1px solid #444; color: #e0e0e0; padding: 2px 8px;
  border-radius: 4px; font-size: 12px; width: 160px; outline: none;
}
#controls input[type=text]:focus { border-color: #6c5ce7; }
#controls input[type=checkbox] { accent-color: #6c5ce7; }
#controls input[type=date] {
  background: #2a2a4a; border: 1px solid #444; color: #e0e0e0; padding: 2px 6px;
  border-radius: 4px; font-size: 12px; outline: none; cursor: pointer;
}
#controls input[type=date]:focus { border-color: #6c5ce7; }
.date-nav {
  background: #2a2a4a; border: 1px solid #444; color: #999; padding: 2px 6px;
  border-radius: 4px; font-size: 12px; cursor: pointer; line-height: 1;
}
.date-nav:hover { border-color: #6c5ce7; color: #e0e0e0; }
#controls .loading { font-size: 11px; color: #fdcb6e; margin-left: 4px; }
#controls .stats { font-size: 11px; color: #555; margin-left: auto; white-space: nowrap; }

.ua-warning {
  font-size: 11px; color: #f39c12; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 4px;
}
.ua-warning:hover { color: #fdcb6e; }
.ua-settings {
  display: none; position: absolute; top: 100%; right: 0; z-index: 200;
  background: rgba(30,30,50,0.98); border: 1px solid #555; border-radius: 6px;
  padding: 12px 16px; min-width: 380px; margin-top: 2px;
}
.ua-settings.visible { display: block; }
.ua-settings label { font-size: 11px; color: #aaa; display: block; margin-bottom: 4px; }
.ua-settings input[type=text] {
  width: 100%; background: #2a2a4a; border: 1px solid #444; color: #e0e0e0;
  padding: 4px 8px; border-radius: 4px; font-size: 12px; outline: none;
}
.ua-settings input[type=text]:focus { border-color: #6c5ce7; }
.ua-settings .hint { font-size: 10px; color: #666; margin-top: 4px; line-height: 1.4; }
.ua-settings .btn {
  margin-top: 8px; padding: 3px 12px; border: 1px solid #6c5ce7; border-radius: 4px;
  background: #6c5ce7; color: #fff; font-size: 11px; cursor: pointer;
}

.spacing-slider {
  display: flex; align-items: center; gap: 5px; font-size: 11px; color: #888; flex-shrink: 0;
}
.spacing-slider input[type=range] {
  width: 70px; height: 3px; accent-color: #6c5ce7; cursor: pointer;
}

.filter-section {
  display: flex; align-items: center; gap: 4px; flex-shrink: 0;
}
.filter-label { font-size: 11px; color: #666; white-space: nowrap; }

.filter-tag {
  display: inline-flex; align-items: center; gap: 3px;
  background: #3a3a5a; border: 1px solid #555; border-radius: 3px;
  padding: 1px 5px; font-size: 10px; color: #ccc;
  margin: 0 1px;
}
.filter-tag .tag-remove {
  cursor: pointer; color: #888; font-size: 11px; line-height: 1;
}
.filter-tag .tag-remove:hover { color: #e74c3c; }

#ignore-input {
  background: transparent; border: none; border-bottom: 1px solid #555;
  color: #aaa; font-size: 10px; padding: 1px 3px; width: 90px; outline: none;
}
#ignore-input:focus { border-color: #6c5ce7; }
#ignore-input::placeholder { color: #555; }

.hide-btn {
  padding: 1px 8px; border: 1px solid #555; border-radius: 3px;
  background: #2a2a4a; color: #999; font-size: 10px; cursor: pointer;
  transition: all 0.15s;
}
.hide-btn:hover { border-color: #6c5ce7; }
.hide-btn.active { background: #e74c3c44; border-color: #e74c3c; color: #e74c3c; }

#graph-container {
  position: fixed; top: 78px; left: 0; right: 0; bottom: 0;
}
svg { width: 100%; height: 100%; }

.link { stroke-opacity: 0.3; }
.link.wikilink { stroke: #6c5ce7; }
.link.category { stroke: #00b894; }
.link.entity { stroke: #fdcb6e; }
.link.highlighted { stroke-opacity: 0.7; }
.link.faded { stroke-opacity: 0.05; }

.node { cursor: pointer; }
.node circle.article-ring { fill: none; stroke-width: 2px; opacity: 0.8; }
.node image { clip-path: url(#round-clip); }
.node text { font-size: 10px; pointer-events: none; fill: #ccc;
             text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
.node.helper circle { stroke: #666; stroke-width: 1px; stroke-dasharray: 3,2; fill-opacity: 0.6; }
.node.helper text { font-size: 9px; fill: #999; }
.node.highlighted .article-ring { stroke-width: 3px; opacity: 1; }
.node.highlighted text { fill: #fff; font-weight: 600; }
.node.faded { opacity: 0.15; }
.node.faded text { opacity: 0; }

#tooltip {
  position: fixed; background: rgba(0,0,0,0.85); color: #eee; padding: 6px 10px;
  border-radius: 6px; font-size: 11px; pointer-events: none; z-index: 200;
  max-width: 280px; display: none; border: 1px solid #555;
}

#side-panel {
  position: fixed; top: 78px; right: -400px; width: 380px; bottom: 0;
  background: rgba(30,30,50,0.97); backdrop-filter: blur(10px);
  border-left: 1px solid #444; z-index: 99; transition: right 0.3s ease;
  overflow-y: auto; padding: 20px;
}
#side-panel.open { right: 0; }
#side-panel .close { float: right; cursor: pointer; font-size: 20px; color: #888; }
#side-panel .close:hover { color: #fff; }
#side-panel h2 { font-size: 18px; margin-bottom: 4px; color: #fff; }
#side-panel .meta { font-size: 12px; color: #888; margin-bottom: 12px; }
#side-panel .cluster-tag {
  display: inline-block; padding: 2px 8px; border-radius: 3px;
  font-size: 11px; font-weight: 600; margin-bottom: 12px;
}
#side-panel img { max-width: 100%; border-radius: 6px; margin-bottom: 12px; }
#side-panel .summary { font-size: 13px; line-height: 1.5; color: #ccc; margin-bottom: 12px; }
#side-panel .connections h3 { font-size: 13px; color: #aaa; margin-bottom: 6px; }
#side-panel .connections ul { list-style: none; font-size: 12px; }
#side-panel .connections li { padding: 2px 0; color: #888; }
#side-panel .connections li a { color: #6c5ce7; text-decoration: none; cursor: pointer; }
#side-panel .connections li a:hover { text-decoration: underline; }
#side-panel a.ext-link { color: #6c5ce7; text-decoration: none; font-size: 13px; display: inline-block; margin-top: 8px; }
#side-panel a.ext-link:hover { text-decoration: underline; }

#legend {
  position: fixed; bottom: 20px; left: 20px; z-index: 50;
  background: rgba(0,0,0,0.8); border-radius: 8px; padding: 12px 16px;
  font-size: 11px; display: none;
}
#legend.visible { display: block; }
#legend h3 { font-size: 11px; color: #aaa; margin-bottom: 6px; }
#legend .item { display: flex; align-items: center; gap: 6px; margin: 3px 0; color: #ccc; }
#legend .swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
#legend .line-swatch { width: 20px; height: 2px; flex-shrink: 0; }
#legend .helper-swatch { width: 10px; height: 10px; border-radius: 50%;
    border: 1px dashed #666; background: #b0b0b0; opacity: 0.6; flex-shrink: 0; }

#progress-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 300; display: none; align-items: center; justify-content: center;
  background: rgba(26,26,46,0.75);
}
#progress-overlay.visible { display: flex; }
#progress-box {
  background: rgba(0,0,0,0.88); border: 1px solid #555; border-radius: 10px;
  padding: 28px 36px; text-align: center; min-width: 300px;
}
.progress-spinner {
  width: 36px; height: 36px; border: 3px solid #333;
  border-top-color: #6c5ce7; border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
#progress-message { font-size: 13px; color: #ccc; }
#progress-step { font-size: 11px; color: #666; margin-top: 8px; }
</style>
</head>
<body>

<div id="controls">
  <div class="controls-row">
    <h1>WikiTop100 <span>Connections</span></h1>
    <div class="sep"></div>
    <label>📅 <button class="date-nav" onclick="goToDate(-1)" title="Previous day">◀</button> <input type="date" id="date-picker"> <button class="date-nav" onclick="goToDate(1)" title="Next day">▶</button></label>
    <span class="loading" id="loading-indicator"></span>
    <div class="sep"></div>
    <label>🔍 <input type="text" id="search" placeholder="Search..."></label>
    <div class="sep"></div>
    <div class="spacing-slider">
      <span>Spacing</span>
      <input type="range" id="spacing" min="0" max="100" value="27">
    </div>
    <div class="sep"></div>
    <label><input type="checkbox" id="toggle-helpers" checked> Helpers</label>
    <label><input type="checkbox" id="toggle-labels"> Labels</label>
    <label><input type="checkbox" id="toggle-legend"> Legend</label>
    <div class="stats" id="stats"></div>
    <span class="ua-warning" id="ua-warning" onclick="toggleUASettings()" title="User-Agent settings">⚙</span>
    <div class="ua-settings" id="ua-settings">
      <label>User-Agent for MediaWiki API requests</label>
      <input type="text" id="ua-input" placeholder="AppName/1.0 (contact: email@example.com)">
      <div class="hint">Wikimedia requires a contact method (email or URL) in the User-Agent string.
      Non-compliant agents may be heavily rate-limited.
      <br>Set <code>WIKI_USER_AGENT</code> in <code>.env</code> or export it as an env var to make this permanent.</div>
      <button class="btn" onclick="saveUA()">Apply</button>
    </div>
  </div>

  <div class="controls-row">
    <div class="filter-section">
      <span class="filter-label">Ignore:</span>
      <span id="ignore-tags"></span>
      <input type="text" id="ignore-input" placeholder="+ add article...">
    </div>
    <div class="sep"></div>
    <div class="filter-section">
      <span class="filter-label">Hide:</span>
      <button class="hide-btn" data-group="Social">Social</button>
      <button class="hide-btn" data-group="Countries">Countries</button>
    </div>
  </div>
</div>

<div id="graph-container">
  <svg id="graph">
    <defs>
      <clipPath id="round-clip"><circle r="25"/></clipPath>
    </defs>
  </svg>
</div>

<div id="tooltip"></div>

<div id="side-panel">
  <span class="close" onclick="closePanel()">✕</span>
  <div id="panel-content"></div>
</div>

<div id="legend"></div>

<div id="progress-overlay">
  <div id="progress-box">
    <div class="progress-spinner"></div>
    <div id="progress-message">Loading...</div>
    <div id="progress-step"></div>
  </div>
</div>

<script>
const WIDTH = window.innerWidth;
const HEIGHT = window.innerHeight - 78;

const CLUSTER_ORDER = ["Sports","Music","Film & TV","Politics","Technology",
  "Science & Nature","History","Geography","Death & Crime","Business","People","Other"];

const FILTER_GROUPS = {
  "Social": ["Instagram", "YouTube", "TikTok", "Twitter", "Facebook", "Snapchat", "LinkedIn", "Reddit", "WhatsApp", "Telegram", "Discord", "Pinterest", "ChatGPT"],
  "Countries": "__cluster__Geography",
};

const DEFAULT_IGNORE = [".xxx", ".xyz", "XXX (Kendrick Lamar song)"];

let graphData, svg, simulation, link, node, nodeMap;
let linkGroup, nodeGroup, labelGroup;
let container;
let ignoreList = [];
let activeFilters = new Set();
let spacingValue = 27;

function showProgress(msg) {
  document.getElementById("progress-overlay").classList.add("visible");
  document.getElementById("progress-message").textContent = msg || "Loading...";
}
function hideProgress() {
  document.getElementById("progress-overlay").classList.remove("visible");
}

let zoom = d3.zoom().scaleExtent([0.1, 8]).on("zoom", event => {
  container.attr("transform", event.transform);
});

const edgeColors = { wikilink: "#6c5ce7", category: "#00b894", entity: "#fdcb6e" };
const edgeLabels = { wikilink: "Wikilink", category: "Shared Category", entity: "Shared Entity" };

let setupComplete = false;
function setupOnce() {
  if (setupComplete) return;
  setupComplete = true;

  document.getElementById("spacing").addEventListener("input", function() {
    spacingValue = parseInt(this.value);
    if (simulation) updateSpacing(spacingValue);
  });

  document.getElementById("ignore-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      const val = this.value.trim();
      if (val) {
        addIgnoreItem(val);
        this.value = "";
      }
    }
  });

  document.querySelectorAll(".hide-btn").forEach(btn => {
    btn.addEventListener("click", function() {
      const group = this.dataset.group;
      if (activeFilters.has(group)) {
        activeFilters.delete(group);
        this.classList.remove("active");
      } else {
        activeFilters.add(group);
        this.classList.add("active");
      }
      applyFilters();
    });
  });

  document.getElementById("toggle-helpers").addEventListener("change", function() {
    if (!nodeGroup) return;
    nodeGroup.selectAll(".node.helper").style("display", this.checked ? null : "none");
    linkGroup.selectAll(".link.category, .link.entity").style("display", this.checked ? null : "none");
  });

  document.getElementById("toggle-labels").addEventListener("change", function() {
    if (!nodeGroup) return;
    nodeGroup.selectAll(".node text").style("display", this.checked ? null : "none");
  });

  document.getElementById("toggle-legend").addEventListener("change", function() {
    document.getElementById("legend").classList.toggle("visible", this.checked);
  });

  document.getElementById("search").addEventListener("input", function() {
    if (!node || !link) return;
    const q = this.value.toLowerCase().trim();
    node.each(function(d) {
      const match = !q || (d.title || d.label || "").toLowerCase().includes(q);
      d3.select(this).style("opacity", match ? 1 : 0.1);
      if (d.type === "article" && match) {
        d3.select(this).select(".article-ring").attr("stroke-width", q ? 3 : 2);
      }
    });
    link.style("opacity", function(d) {
      const s = nodeMap[d.source.id || d.source];
      const t = nodeMap[d.target.id || d.target];
      return s && t && (!q || (s.title||"").toLowerCase().includes(q) || (t.title||"").toLowerCase().includes(q)) ? 0.3 : 0.03;
    });
  });

  document.getElementById("date-picker").addEventListener("change", onDateChange);
}

function updateSpacing(val) {
  const mult = 0.2 + (val / 100) * 2.96;
  simulation.force("charge", d3.forceManyBody().strength(d =>
    d.type === "helper" ? -40 * mult : -120 * mult
  ));
  simulation.alpha(0.3).restart();
}

function initIgnoreList() {
  const params = new URLSearchParams(window.location.search);
  const ignoreParam = params.get("ignore");
  if (ignoreParam) {
    ignoreList = ignoreParam.split(",").map(s => s.trim()).filter(Boolean);
  } else {
    ignoreList = [...DEFAULT_IGNORE];
  }
  renderIgnoreTags();
}

function renderIgnoreTags() {
  const container = document.getElementById("ignore-tags");
  container.innerHTML = ignoreList.map(item =>
    `<span class="filter-tag">${escHtml(item)} <span class="tag-remove" data-item="${escHtml(item)}">\u2715</span></span>`
  ).join("");
  container.querySelectorAll(".tag-remove").forEach(btn => {
    btn.addEventListener("click", () => removeIgnoreItem(btn.dataset.item));
  });
}

function addIgnoreItem(item) {
  item = item.trim();
  if (!item || ignoreList.includes(item)) return;
  ignoreList.push(item);
  renderIgnoreTags();
  updateIgnoreUrl();
  refetchWithIgnore();
}

function removeIgnoreItem(item) {
  ignoreList = ignoreList.filter(i => i !== item);
  renderIgnoreTags();
  updateIgnoreUrl();
  refetchWithIgnore();
}

function updateIgnoreUrl() {
  const params = new URLSearchParams(window.location.search);
  if (ignoreList.length > 0) {
    params.set("ignore", ignoreList.join(","));
  } else {
    params.delete("ignore");
  }
  const qs = params.toString();
  const newUrl = window.location.pathname + (qs ? "?" + qs : "");
  window.history.replaceState({}, "", newUrl);
}

function applyFilters() {
  if (!node || !graphData) return;
  const hiddenIds = new Set();
  for (const filter of activeFilters) {
    const patterns = FILTER_GROUPS[filter];
    if (patterns === "__cluster__Geography") {
      graphData.nodes.forEach(n => {
        if (n.type === "article" && n.cluster === "Geography")
          hiddenIds.add(n.id);
      });
    } else {
      patterns.forEach(p => {
        graphData.nodes.forEach(n => {
          if (n.type === "article" && n.title === p)
            hiddenIds.add(n.id);
        });
      });
    }
  }
  node.style("display", d => {
    if (d.type !== "article") return null;
    return hiddenIds.has(d.id) ? "none" : null;
  });
  link.style("display", l => {
    if (hiddenIds.size === 0) return null;
    const sid = l.source.id || l.source;
    const tid = l.target.id || l.target;
    return hiddenIds.has(sid) || hiddenIds.has(tid) ? "none" : null;
  });
}

const picker = document.getElementById("date-picker");
setupOnce();
initIgnoreList();
loadLatestDate();

function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

async function loadLatestDate() {
  let d = new Date();
  for (let attempt = 0; attempt < 7; attempt++) {
    picker.value = formatDate(d);
    try {
      const data = await fetchGraph(
        String(d.getFullYear()),
        String(d.getMonth() + 1),
        String(d.getDate())
      );
      renderGraph(data);
      applyFilters();
      return;
    } catch (e) {
      console.warn(`No data for ${formatDate(d)}, trying previous day`);
      d.setDate(d.getDate() - 1);
    }
  }
  document.getElementById("loading-indicator").textContent = "No recent data found";
}

async function fetchGraph(year, month, day) {
  const params = new URLSearchParams({ year, month, day });
  const ua = loadUA();
  if (ua) params.set("user_agent", ua);
  if (ignoreList.length > 0) {
    params.set("ignore", ignoreList.join(","));
  }
  showProgress("Fetching top 100...");
  const resp = await fetch(`/api/graph?${params.toString()}`);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop();
    for (const line of lines) {
      if (!line.trim()) continue;
      const data = JSON.parse(line);
      if (data.type === "graph") {
        reader.cancel();
        hideProgress();
        return data.data;
      } else if (data.type === "error") {
        reader.cancel();
        hideProgress();
        throw new Error(data.message);
      } else if (data.type === "progress") {
        showProgress(data.message);
        document.getElementById("progress-step").textContent = "";
      }
    }
  }
  hideProgress();
  throw new Error("Incomplete stream");
}

function refetchWithIgnore() {
  const parts = picker.value.split("-");
  if (parts.length === 3) {
    fetchGraph(parts[0], String(parseInt(parts[1])), String(parseInt(parts[2])))
      .then(data => { renderGraph(data); applyFilters(); })
      .catch(() => { hideProgress(); document.getElementById("loading-indicator").textContent = "No data for this date"; });
  }
}

function onDateChange() {
  const parts = picker.value.split("-");
  if (parts.length === 3) {
    document.getElementById("loading-indicator").textContent = "";
    fetchGraph(parts[0], String(parseInt(parts[1])), String(parseInt(parts[2])))
      .then(data => { renderGraph(data); applyFilters(); })
      .catch(() => { hideProgress(); document.getElementById("loading-indicator").textContent = "No data for this date"; });
  }
}

function goToDate(delta) {
  const parts = picker.value.split("-");
  if (parts.length !== 3) return;
  const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
  d.setDate(d.getDate() + delta);
  picker.value = formatDate(d);
  onDateChange();
}

function renderGraph(data) {
  graphData = data;
  document.getElementById("stats").textContent =
    `${data.meta.total_articles} articles · ${data.meta.total_nodes} nodes · ${data.meta.total_edges} connections`;
  showUAWarning(data.meta);
  document.getElementById("legend").classList.remove("visible");
  document.getElementById("toggle-legend").checked = false;
  document.getElementById("toggle-helpers").checked = true;
  document.getElementById("toggle-labels").checked = true;
  buildLegend();
  initGraph(data);
  document.getElementById("toggle-labels").dispatchEvent(new Event("change"));
}

function buildLegend() {
  const leg = document.getElementById("legend");
  leg.innerHTML = "<h3>Article Topic</h3>";
  for (const c of CLUSTER_ORDER) {
    const color = getClusterColor(c);
    leg.innerHTML += `<div class="item"><div class="swatch" style="background:${color}"></div>${c}</div>`;
  }
  leg.innerHTML += "<h3 style='margin-top:8px'>Connections</h3>";
  leg.innerHTML += `<div class="item"><div class="line-swatch" style="background:${edgeColors.wikilink}"></div>Wikilink</div>`;
  leg.innerHTML += `<div class="item"><div class="line-swatch" style="background:${edgeColors.category}"></div>Category</div>`;
  leg.innerHTML += `<div class="item"><div class="line-swatch" style="background:${edgeColors.entity}"></div>Entity</div>`;
  leg.innerHTML += "<h3 style='margin-top:8px'>Nodes</h3>";
  leg.innerHTML += `<div class="item"><div class="swatch" style="background:#6c5ce7"></div>Article</div>`;
  leg.innerHTML += `<div class="item"><div class="helper-swatch"></div>Helper</div>`;
}

function getClusterColor(cluster) {
  const map = {
    "Sports":"#e74c3c","Music":"#9b59b6","Film & TV":"#3498db","Politics":"#f39c12",
    "Technology":"#1abc9c","Science & Nature":"#16a085","History":"#8e44ad",
    "Geography":"#27ae60","Death & Crime":"#7f8c8d","Business":"#e67e22",
    "People":"#2ecc71","Other":"#95a5a6"
  };
  return map[cluster] || "#95a5a6";
}

function initGraph(data) {
  svg = d3.select("#graph");
  svg.selectAll("*").remove();
  container = svg.append("g").attr("class", "container");
  svg.call(zoom);

  const nodes = data.nodes.map(d => ({ ...d }));
  const links = data.links.map(d => ({ ...d }));

  nodeMap = {};
  nodes.forEach(n => nodeMap[n.id] = n);

  links.forEach(l => {
    l.source = l.source;
    l.target = l.target;
  });

  simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(d => d.type === "wikilink" ? 80 : 60)
      .strength(d => d.type === "wikilink" ? 0.8 : 0.3))
    .force("charge", d3.forceManyBody().strength(d => d.type === "helper" ? -40 : -120))
    .force("center", d3.forceCenter(WIDTH / 2, HEIGHT / 2))
    .force("collide", d3.forceCollide(d => (d.type === "helper" ? 8 : Math.min(d.size || 15, 25) + 5)))
    .on("tick", ticked);

  linkGroup = container.append("g").attr("class", "links");
  link = linkGroup.selectAll("line")
    .data(links).join("line")
    .attr("class", d => `link ${d.type}`)
    .attr("stroke-width", d => Math.max(0.5, Math.min(3, d.weight)))
    .attr("stroke", d => edgeColors[d.type] || "#555");

  nodeGroup = container.append("g").attr("class", "nodes");

  node = nodeGroup.selectAll("g.node")
    .data(nodes).join("g")
    .attr("class", d => `node ${d.type}`)
    .call(d3.drag()
      .on("start", dragstarted)
      .on("drag", dragged)
      .on("end", dragended));

  node.each(function(d) {
    const g = d3.select(this);
    if (d.type === "helper") {
      g.append("circle")
        .attr("r", 5)
        .attr("fill", d.color || "#b0b0b0")
        .attr("stroke", "#666")
        .attr("stroke-width", 1)
        .attr("stroke-dasharray", "3,2")
        .attr("fill-opacity", 0.6);
      g.append("text")
        .attr("dx", 8).attr("dy", 3)
        .text(truncate(d.label || "", 25));
    } else {
      const r = Math.min(d.size || 12, 25);
      g.append("circle")
        .attr("class", "article-ring")
        .attr("r", r)
        .attr("stroke", d.color || "#6c5ce7");
      if (d.image_url && !d.image_url.includes("W.svg")) {
        g.append("image")
          .attr("xlink:href", d.image_url)
          .attr("x", -r).attr("y", -r)
          .attr("width", r*2).attr("height", r*2)
          .attr("clip-path", "url(#round-clip)");
      } else {
        g.append("circle")
          .attr("r", r-1)
          .attr("fill", d.color || "#6c5ce7")
          .attr("fill-opacity", 0.3);
      }
      g.append("text")
        .attr("dx", 0).attr("dy", r + 12)
        .attr("text-anchor", "middle")
        .text(truncate(d.title || "", 20));
    }
  });

  node.on("mouseover", hoverOn)
    .on("mouseout", hoverOff)
    .on("click", clickNode);

  if (spacingValue !== 27) updateSpacing(spacingValue);
}

function ticked() {
  link
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
}

function dragstarted(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
function dragended(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

function hoverOn(event, d) {
  if (d.type === "helper") {
    const connected = new Set();
    connected.add(d.id);
    graphData.links.forEach(l => {
      const sid = l.source.id || l.source;
      const tid = l.target.id || l.target;
      if (sid === d.id) connected.add(tid);
      if (tid === d.id) connected.add(sid);
    });
    node.classed("faded", n => !connected.has(n.id));
    node.classed("highlighted", n => n.id === d.id);
    link.classed("faded", l => {
      const sid = l.source.id || l.source;
      const tid = l.target.id || l.target;
      return sid !== d.id && tid !== d.id;
    });
    link.classed("highlighted", l => {
      const sid = l.source.id || l.source;
      const tid = l.target.id || l.target;
      return sid === d.id || tid === d.id;
    });
    return;
  }

  const connected = new Set();
  connected.add(d.id);
  graphData.links.forEach(l => {
    const sid = l.source.id || l.source;
    const tid = l.target.id || l.target;
    if (sid === d.id) connected.add(tid);
    if (tid === d.id) connected.add(sid);
  });

  node.classed("faded", n => !connected.has(n.id));
  node.classed("highlighted", n => n.id === d.id);
  link.classed("faded", l => {
    const sid = l.source.id || l.source;
    const tid = l.target.id || l.target;
    return sid !== d.id && tid !== d.id;
  });
  link.classed("highlighted", l => {
    const sid = l.source.id || l.source;
    const tid = l.target.id || l.target;
    return sid === d.id || tid === d.id;
  });

  const tip = document.getElementById("tooltip");
  if (d.type === "article") {
    tip.style.display = "block";
    tip.style.left = (event.pageX + 12) + "px";
    tip.style.top = (event.pageY - 10) + "px";
    tip.innerHTML = `<strong>${d.title}</strong><br>#${d.rank} · ${fmtViews(d.views)} views · ${d.cluster}`;
  } else {
    tip.style.display = "block";
    tip.style.left = (event.pageX + 12) + "px";
    tip.style.top = (event.pageY - 10) + "px";
    const connCount = connected.size - 1;
    tip.innerHTML = `<strong>${d.label}</strong> (${d.helper_type})<br>Connected to ${connCount} articles`;
  }
}

function hoverOff() {
  node.classed("faded", false);
  node.classed("highlighted", false);
  link.classed("faded", false);
  link.classed("highlighted", false);
  document.getElementById("tooltip").style.display = "none";
}

function showArticle(id) {
  const n = graphData.nodes.find(d => d.id === id);
  if (n) clickNode(null, n);
}

function clickNode(event, d) {
  document.getElementById("tooltip").style.display = "none";
  const panel = document.getElementById("side-panel");
  const content = document.getElementById("panel-content");

  let connectedArticles = [];
  graphData.links.forEach(l => {
    const sid = l.source.id || l.source;
    const tid = l.target.id || l.target;
    if (sid === d.id && graphData.nodes.find(n => n.id === tid && n.type === "article"))
      connectedArticles.push({ id: tid, type: l.type });
    if (tid === d.id && graphData.nodes.find(n => n.id === sid && n.type === "article"))
      connectedArticles.push({ id: sid, type: l.type });
  });

  let html = `<span class="close" onclick="closePanel()">\u2715</span>`;

  if (d.type === "helper") {
    const helperLabel = d.label || d.id.replace(/^(cat:|ent:)/, "");
    const helperType = d.helper_type === "category" ? "Category" : "Named Entity";
    const wikiUrl = d.helper_type === "category"
      ? `https://en.wikipedia.org/wiki/Category:${encodeURIComponent(helperLabel.replace(/ /g, "_"))}`
      : `https://en.wikipedia.org/wiki/${encodeURIComponent(helperLabel.replace(/ /g, "_"))}`;
    html += `<h2>${escHtml(helperLabel)}</h2>`;
    html += `<div class="meta">${helperType} helper</div>`;
    html += `<div class="connections"><h3>Connected articles (${connectedArticles.length})</h3><ul>`;
    const seen = new Set();
    connectedArticles.forEach(c => {
      if (seen.has(c.id)) return;
      seen.add(c.id);
      const cn = graphData.nodes.find(n => n.id === c.id);
      const label = cn ? cn.title || cn.label : c.id;
      const edgeSym = { wikilink: "\uD83D\uDD17", category: "\uD83D\uDCC1", entity: "\uD83D\uDD24" }[c.type] || "\u2022";
      html += `<li>${edgeSym} <a onclick="showArticle('${c.id}')">${escHtml(label)}</a></li>`;
    });
    html += `</ul></div>`;
    html += `<a class="ext-link" href="${wikiUrl}" target="_blank">Open on Wikipedia \u2192</a>`;
  } else {
    const color = d.color || "#6c5ce7";
    html += `<h2>${escHtml(d.title)}</h2>`;
    html += `<div class="meta">#${d.rank} · ${fmtViews(d.views)} views</div>`;
    html += `<div class="cluster-tag" style="background:${color}44;color:${color}">${d.cluster}</div>`;
    if (d.image_url && !d.image_url.includes("W.svg")) {
      html += `<img src="${d.image_url}" alt="${d.title}">`;
    }
    if (d.summary) {
      html += `<div class="summary">${d.summary}</div>`;
    }
    if (connectedArticles.length > 0) {
      html += `<div class="connections"><h3>Connected (${connectedArticles.length})</h3><ul>`;
      const seen = new Set();
      connectedArticles.forEach(c => {
        if (seen.has(c.id)) return;
        seen.add(c.id);
        const cn = graphData.nodes.find(n => n.id === c.id);
        const label = cn ? cn.title || cn.label : c.id;
        const edgeSym = { wikilink: "\uD83D\uDD17", category: "\uD83D\uDCC1", entity: "\uD83D\uDD24" }[c.type] || "\u2022";
        html += `<li>${edgeSym} <a onclick="showArticle('${c.id}')">${escHtml(label)}</a></li>`;
      });
      html += `</ul></div>`;
    }
    html += `<a class="ext-link" href="${d.url}" target="_blank">Open on Wikipedia \u2192</a>`;
  }

  content.innerHTML = html;
  panel.classList.add("open");
}

function closePanel() {
  document.getElementById("side-panel").classList.remove("open");
}

function fmtViews(v) {
  if (v >= 1000000) return (v / 1000000).toFixed(1) + "M";
  if (v >= 1000) return (v / 1000).toFixed(1) + "K";
  return v.toString();
}

function truncate(s, n) {
  return s.length > n ? s.slice(0, n-1) + "\u2026" : s;
}

function escHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function loadUA() {
  return localStorage.getItem("wiki_user_agent") || "";
}
function saveUA() {
  const val = document.getElementById("ua-input").value.trim();
  if (val) {
    localStorage.setItem("wiki_user_agent", val);
  } else {
    localStorage.removeItem("wiki_user_agent");
  }
  document.getElementById("ua-settings").classList.remove("visible");
  refetchWithIgnore();
}
function toggleUASettings() {
  const panel = document.getElementById("ua-settings");
  panel.classList.toggle("visible");
  if (panel.classList.contains("visible")) {
    const ua = loadUA();
    document.getElementById("ua-input").value = ua;
  }
}
function showUAWarning(meta) {
  const el = document.getElementById("ua-warning");
  if (meta && meta.ua_compliant === false) {
    el.style.display = "inline-flex";
    el.title = "Non-compliant User-Agent — may be rate-limited. Click to configure.";
  } else {
    el.style.display = "none";
  }
}
</script>
