<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wikipedia Top 100 Connections</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
       background: #1a1a2e; color: #e0e0e0; overflow: hidden; height: 100vh; }

#controls {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(26,26,46,0.95); backdrop-filter: blur(10px);
  padding: 10px 20px; display: flex; align-items: center; gap: 16px;
  border-bottom: 1px solid #333; height: 52px;
}
#controls h1 { font-size: 16px; font-weight: 700; color: #fff; white-space: nowrap; }
#controls h1 span { color: #888; font-weight: 400; }
#controls .sep { width: 1px; height: 24px; background: #444; }
#controls label { font-size: 12px; color: #aaa; display: flex; align-items: center; gap: 4px; cursor: pointer; }
#controls input[type=text] {
  background: #2a2a4a; border: 1px solid #444; color: #e0e0e0; padding: 4px 10px;
  border-radius: 4px; font-size: 13px; width: 200px; outline: none;
}
#controls input[type=text]:focus { border-color: #6c5ce7; }
#controls input[type=checkbox] { accent-color: #6c5ce7; }
#controls .stats { font-size: 11px; color: #666; margin-left: auto; white-space: nowrap; }

#graph-container {
  position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
}
svg { width: 100%; height: 100%; }

.link { stroke-opacity: 0.3; }
.link.wikilink { stroke: #6c5ce7; }
.link.category { stroke: #00b894; }
.link.entity { stroke: #fdcb6e; }
.link.highlighted { stroke-opacity: 0.7; }
.link.faded { stroke-opacity: 0.05; }

.node { cursor: pointer; }
.node circle.article-ring { fill: none; stroke-width: 2px; opacity: 0.8; }
.node image { clip-path: url(#round-clip); }
.node text { font-size: 10px; pointer-events: none; fill: #ccc;
             text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
.node.helper circle { stroke: #666; stroke-width: 1px; stroke-dasharray: 3,2; fill-opacity: 0.6; }
.node.helper text { font-size: 9px; fill: #999; }
.node.highlighted .article-ring { stroke-width: 3px; opacity: 1; }
.node.highlighted text { fill: #fff; font-weight: 600; }
.node.faded { opacity: 0.15; }
.node.faded text { opacity: 0; }

#tooltip {
  position: fixed; background: rgba(0,0,0,0.85); color: #eee; padding: 8px 12px;
  border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 200;
  max-width: 300px; display: none; border: 1px solid #555;
}

#side-panel {
  position: fixed; top: 52px; right: -400px; width: 380px; bottom: 0;
  background: rgba(30,30,50,0.97); backdrop-filter: blur(10px);
  border-left: 1px solid #444; z-index: 99; transition: right 0.3s ease;
  overflow-y: auto; padding: 20px;
}
#side-panel.open { right: 0; }
#side-panel .close { float: right; cursor: pointer; font-size: 20px; color: #888; }
#side-panel .close:hover { color: #fff; }
#side-panel h2 { font-size: 18px; margin-bottom: 4px; color: #fff; }
#side-panel .meta { font-size: 12px; color: #888; margin-bottom: 12px; }
#side-panel .cluster-tag {
  display: inline-block; padding: 2px 8px; border-radius: 3px;
  font-size: 11px; font-weight: 600; margin-bottom: 12px;
}
#side-panel img { max-width: 100%; border-radius: 6px; margin-bottom: 12px; }
#side-panel .summary { font-size: 13px; line-height: 1.5; color: #ccc; margin-bottom: 12px; }
#side-panel .connections h3 { font-size: 13px; color: #aaa; margin-bottom: 6px; }
#side-panel .connections ul { list-style: none; font-size: 12px; }
#side-panel .connections li { padding: 2px 0; color: #888; }
#side-panel .connections li a { color: #6c5ce7; text-decoration: none; cursor: pointer; }
#side-panel .connections li a:hover { text-decoration: underline; }
#side-panel a.ext-link { color: #6c5ce7; text-decoration: none; font-size: 13px; display: inline-block; margin-top: 8px; }
#side-panel a.ext-link:hover { text-decoration: underline; }

#legend {
  position: fixed; bottom: 20px; left: 20px; z-index: 50;
  background: rgba(0,0,0,0.8); border-radius: 8px; padding: 12px 16px;
  font-size: 11px; display: none;
}
#legend.visible { display: block; }
#legend h3 { font-size: 11px; color: #aaa; margin-bottom: 6px; }
#legend .item { display: flex; align-items: center; gap: 6px; margin: 3px 0; color: #ccc; }
#legend .swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
#legend .line-swatch { width: 20px; height: 2px; flex-shrink: 0; }
#legend .helper-swatch { width: 10px; height: 10px; border-radius: 50%;
    border: 1px dashed #666; background: #b0b0b0; opacity: 0.6; flex-shrink: 0; }
</style>
</head>
<body>

<div id="controls">
  <h1>WikiTop100 <span>Connections</span></h1>
  <div class="sep"></div>
  <label>🔍 <input type="text" id="search" placeholder="Search articles..."></label>
  <div class="sep"></div>
  <label><input type="checkbox" id="toggle-helpers" checked> Helpers</label>
  <label><input type="checkbox" id="toggle-labels"> Labels</label>
  <label><input type="checkbox" id="toggle-legend"> Legend</label>
  <div class="stats" id="stats"></div>
</div>

<div id="graph-container">
  <svg id="graph">
    <defs>
      <clipPath id="round-clip"><circle r="25"/></clipPath>
    </defs>
  </svg>
</div>

<div id="tooltip"></div>

<div id="side-panel">
  <span class="close" onclick="closePanel()">✕</span>
  <div id="panel-content"></div>
</div>

<div id="legend"></div>

<script>
const WIDTH = window.innerWidth;
const HEIGHT = window.innerHeight - 52;

const CLUSTER_ORDER = ["Sports","Music","Film & TV","Politics","Technology",
  "Science & Nature","History","Geography","Death & Crime","Business","People","Other"];

let graphData, svg, simulation, link, node, label;
let linkGroup, nodeGroup, labelGroup;
let zoom = d3.zoom().scaleExtent([0.1, 8]).on("zoom", event => {
  container.attr("transform", event.transform);
});
let container;

const edgeColors = { wikilink: "#6c5ce7", category: "#00b894", entity: "#fdcb6e" };
const edgeLabels = { wikilink: "Wikilink", category: "Shared Category", entity: "Shared Entity" };

d3.json("graph_data.json").then(data => {
  graphData = data;
  document.getElementById("stats").textContent =
    `${data.meta.total_articles} articles · ${data.meta.total_nodes} nodes · ${data.meta.total_edges} connections`;

  buildLegend();
  initGraph(data);
});

function buildLegend() {
  const leg = document.getElementById("legend");
  leg.innerHTML = "<h3>Article Topic</h3>";
  for (const c of CLUSTER_ORDER) {
    const color = getClusterColor(c);
    leg.innerHTML += `<div class="item"><div class="swatch" style="background:${color}"></div>${c}</div>`;
  }
  leg.innerHTML += "<h3 style='margin-top:8px'>Connections</h3>";
  leg.innerHTML += `<div class="item"><div class="line-swatch" style="background:${edgeColors.wikilink}"></div>Wikilink</div>`;
  leg.innerHTML += `<div class="item"><div class="line-swatch" style="background:${edgeColors.category}"></div>Category</div>`;
  leg.innerHTML += `<div class="item"><div class="line-swatch" style="background:${edgeColors.entity}"></div>Entity</div>`;
  leg.innerHTML += "<h3 style='margin-top:8px'>Nodes</h3>";
  leg.innerHTML += `<div class="item"><div class="swatch" style="background:#6c5ce7"></div>Article</div>`;
  leg.innerHTML += `<div class="item"><div class="helper-swatch"></div>Helper</div>`;
}

function getClusterColor(cluster) {
  const map = {
    "Sports":"#e74c3c","Music":"#9b59b6","Film & TV":"#3498db","Politics":"#f39c12",
    "Technology":"#1abc9c","Science & Nature":"#16a085","History":"#8e44ad",
    "Geography":"#27ae60","Death & Crime":"#7f8c8d","Business":"#e67e22",
    "People":"#2ecc71","Other":"#95a5a6"
  };
  return map[cluster] || "#95a5a6";
}

function initGraph(data) {
  svg = d3.select("#graph");
  svg.selectAll("*").remove();
  container = svg.append("g").attr("class", "container");

  svg.call(zoom);

  const nodes = data.nodes.map(d => ({ ...d }));
  const links = data.links.map(d => ({ ...d }));

  const nodeMap = {};
  nodes.forEach(n => nodeMap[n.id] = n);

  links.forEach(l => {
    l.source = l.source;
    l.target = l.target;
  });

  simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(d => d.type === "wikilink" ? 80 : 60)
      .strength(d => d.type === "wikilink" ? 0.8 : 0.3))
    .force("charge", d3.forceManyBody().strength(d => d.type === "helper" ? -40 : -120))
    .force("center", d3.forceCenter(WIDTH / 2, HEIGHT / 2))
    .force("collide", d3.forceCollide(d => (d.type === "helper" ? 8 : Math.min(d.size || 15, 25) + 5)))
    .on("tick", ticked);

  linkGroup = container.append("g").attr("class", "links");
  link = linkGroup.selectAll("line")
    .data(links).join("line")
    .attr("class", d => `link ${d.type}`)
    .attr("stroke-width", d => Math.max(0.5, Math.min(3, d.weight)))
    .attr("stroke", d => edgeColors[d.type] || "#555");

  nodeGroup = container.append("g").attr("class", "nodes");

  node = nodeGroup.selectAll("g.node")
    .data(nodes).join("g")
    .attr("class", d => `node ${d.type}`)
    .call(d3.drag()
      .on("start", dragstarted)
      .on("drag", dragged)
      .on("end", dragended));

  node.each(function(d) {
    const g = d3.select(this);
    if (d.type === "helper") {
      g.append("circle")
        .attr("r", 5)
        .attr("fill", d.color || "#b0b0b0")
        .attr("stroke", "#666")
        .attr("stroke-width", 1)
        .attr("stroke-dasharray", "3,2")
        .attr("fill-opacity", 0.6);
      g.append("text")
        .attr("dx", 8).attr("dy", 3)
        .text(truncate(d.label || "", 25));
    } else {
      const r = Math.min(d.size || 12, 25);
      g.append("circle")
        .attr("class", "article-ring")
        .attr("r", r)
        .attr("stroke", d.color || "#6c5ce7");
      if (d.image_url && !d.image_url.includes("W.svg")) {
        g.append("image")
          .attr("xlink:href", d.image_url)
          .attr("x", -r).attr("y", -r)
          .attr("width", r*2).attr("height", r*2)
          .attr("clip-path", "url(#round-clip)");
      } else {
        g.append("circle")
          .attr("r", r-1)
          .attr("fill", d.color || "#6c5ce7")
          .attr("fill-opacity", 0.3);
      }
      g.append("text")
        .attr("dx", 0).attr("dy", r + 12)
        .attr("text-anchor", "middle")
        .text(truncate(d.title || "", 20));
    }
  });

  node.on("mouseover", hoverOn)
    .on("mouseout", hoverOff)
    .on("click", clickNode);

  labelGroup = container.append("g").attr("class", "labels").style("display", "none");

  document.getElementById("toggle-helpers").addEventListener("change", function() {
    nodeGroup.selectAll(".node.helper").style("display", this.checked ? null : "none");
    linkGroup.selectAll(".link.category, .link.entity").style("display", this.checked ? null : "none");
  });

  document.getElementById("toggle-labels").addEventListener("change", function() {
    nodeGroup.selectAll(".node text").style("display", this.checked ? null : "none");
  });

  document.getElementById("toggle-legend").addEventListener("change", function() {
    document.getElementById("legend").classList.toggle("visible", this.checked);
  });

  document.getElementById("search").addEventListener("input", function() {
    const q = this.value.toLowerCase().trim();
    node.each(function(d) {
      const match = !q || (d.title || d.label || "").toLowerCase().includes(q);
      d3.select(this).style("opacity", match ? 1 : 0.1);
      if (d.type === "article" && match) {
        d3.select(this).select(".article-ring").attr("stroke-width", q ? 3 : 2);
      }
    });
    link.style("opacity", function(d) {
      const s = nodeMap[d.source.id || d.source];
      const t = nodeMap[d.target.id || d.target];
      return s && t && (!q || (s.title||"").toLowerCase().includes(q) || (t.title||"").toLowerCase().includes(q)) ? 0.3 : 0.03;
    });
  });
}

function ticked() {
  link
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
}

function dragstarted(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
function dragended(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

function hoverOn(event, d) {
  if (d.type === "helper") {
    const connected = new Set();
    connected.add(d.id);
    graphData.links.forEach(l => {
      const sid = l.source.id || l.source;
      const tid = l.target.id || l.target;
      if (sid === d.id) connected.add(tid);
      if (tid === d.id) connected.add(sid);
    });
    node.classed("faded", n => !connected.has(n.id));
    node.classed("highlighted", n => n.id === d.id);
    link.classed("faded", l => {
      const sid = l.source.id || l.source;
      const tid = l.target.id || l.target;
      return sid !== d.id && tid !== d.id;
    });
    link.classed("highlighted", l => {
      const sid = l.source.id || l.source;
      const tid = l.target.id || l.target;
      return sid === d.id || tid === d.id;
    });
    return;
  }

  const connected = new Set();
  connected.add(d.id);
  graphData.links.forEach(l => {
    const sid = l.source.id || l.source;
    const tid = l.target.id || l.target;
    if (sid === d.id) connected.add(tid);
    if (tid === d.id) connected.add(sid);
  });

  node.classed("faded", n => !connected.has(n.id));
  node.classed("highlighted", n => n.id === d.id);
  link.classed("faded", l => {
    const sid = l.source.id || l.source;
    const tid = l.target.id || l.target;
    return sid !== d.id && tid !== d.id;
  });
  link.classed("highlighted", l => {
    const sid = l.source.id || l.source;
    const tid = l.target.id || l.target;
    return sid === d.id || tid === d.id;
  });

  const tip = document.getElementById("tooltip");
  if (d.type === "article") {
    tip.style.display = "block";
    tip.style.left = (event.pageX + 12) + "px";
    tip.style.top = (event.pageY - 10) + "px";
    tip.innerHTML = `<strong>${d.title}</strong><br>#${d.rank} · ${fmtViews(d.views)} views · ${d.cluster}`;
  } else {
    tip.style.display = "block";
    tip.style.left = (event.pageX + 12) + "px";
    tip.style.top = (event.pageY - 10) + "px";
    const connCount = connected.size - 1;
    tip.innerHTML = `<strong>${d.label}</strong> (${d.helper_type})<br>Connected to ${connCount} articles`;
  }
}

function hoverOff() {
  node.classed("faded", false);
  node.classed("highlighted", false);
  link.classed("faded", false);
  link.classed("highlighted", false);
  link.classed("faded", false);
  document.getElementById("tooltip").style.display = "none";
}

function showArticle(id) {
  const n = graphData.nodes.find(d => d.id === id);
  if (n) clickNode(null, n);
}

function clickNode(event, d) {
  if (d.type === "helper") return;
  document.getElementById("tooltip").style.display = "none";
  const panel = document.getElementById("side-panel");
  const content = document.getElementById("panel-content");
  const color = d.color || "#6c5ce7";

  let connectedArticles = [];
  graphData.links.forEach(l => {
    const sid = l.source.id || l.source;
    const tid = l.target.id || l.target;
    if (sid === d.id && graphData.nodes.find(n => n.id === tid && n.type === "article"))
      connectedArticles.push({ id: tid, type: l.type });
    if (tid === d.id && graphData.nodes.find(n => n.id === sid && n.type === "article"))
      connectedArticles.push({ id: sid, type: l.type });
  });

  let html = `<span class="close" onclick="closePanel()">✕</span>`;
  html += `<h2>${d.title}</h2>`;
  html += `<div class="meta">#${d.rank} · ${fmtViews(d.views)} views</div>`;
  html += `<div class="cluster-tag" style="background:${color}44;color:${color}">${d.cluster}</div>`;
  if (d.image_url && !d.image_url.includes("W.svg")) {
    html += `<img src="${d.image_url}" alt="${d.title}">`;
  }
  if (d.summary) {
    html += `<div class="summary">${d.summary}</div>`;
  }

  if (connectedArticles.length > 0) {
    html += `<div class="connections"><h3>Connected (${connectedArticles.length})</h3><ul>`;
    const seen = new Set();
    connectedArticles.forEach(c => {
      if (seen.has(c.id)) return;
      seen.add(c.id);
      const cn = graphData.nodes.find(n => n.id === c.id);
      const label = cn ? cn.title || cn.label : c.id;
      const edgeSym = { wikilink: "🔗", category: "📁", entity: "🔤" }[c.type] || "•";
      html += `<li>${edgeSym} <a onclick="showArticle('${c.id}')">${label}</a></li>`;
    });
    html += `</ul></div>`;
  }

  html += `<a class="ext-link" href="${d.url}" target="_blank">Open on Wikipedia →</a>`;

  content.innerHTML = html;
  panel.classList.add("open");
}

function closePanel() {
  document.getElementById("side-panel").classList.remove("open");
}

function fmtViews(v) {
  if (v >= 1000000) return (v / 1000000).toFixed(1) + "M";
  if (v >= 1000) return (v / 1000).toFixed(1) + "K";
  return v.toString();
}

function truncate(s, n) {
  return s.length > n ? s.slice(0, n-1) + "…" : s;
}
</script>
</body>
</html>
